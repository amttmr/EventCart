name: EventCart CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  packages: write

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Prepare Maven wrapper
        run: chmod +x mvnw

      - name: Run unit tests
        run: ./mvnw test

      - name: Run Testcontainers integration tests
        run: ./mvnw -P integration-tests verify

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - catalog-service
          - cart-service
          - order-service
          - inventory-service
          - payment-service
          - notification-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build service image
        run: docker build -f services/${{ matrix.service }}/Dockerfile -t eventcart/${{ matrix.service }}:${{ github.sha }} .

  docker-publish:
    name: Publish Docker images
    runs-on: ubuntu-latest
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - catalog-service
          - cart-service
          - order-service
          - inventory-service
          - payment-service
          - notification-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push service image
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/eventcart/${{ matrix.service }}:${{ github.ref_name }}"
          docker build -f services/${{ matrix.service }}/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

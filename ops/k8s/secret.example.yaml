apiVersion: v1
kind: Secret
metadata:
  name: eventcart-secrets
  namespace: eventcart
type: Opaque
stringData:
  CATALOG_MONGODB_URI: "mongodb://user:password@mongo.example.com:27017/eventcart_catalog?authSource=admin"
  CART_MONGODB_URI: "mongodb://user:password@mongo.example.com:27017/eventcart_cart?authSource=admin"
  ORDER_MONGODB_URI: "mongodb://user:password@mongo.example.com:27017/eventcart_order?authSource=admin"
  INVENTORY_MONGODB_URI: "mongodb://user:password@mongo.example.com:27017/eventcart_inventory?authSource=admin"
  PAYMENT_MONGODB_URI: "mongodb://user:password@mongo.example.com:27017/eventcart_payment?authSource=admin"
  NOTIFICATION_MONGODB_URI: "mongodb://user:password@mongo.example.com:27017/eventcart_notification?authSource=admin"
  EVENTCART_INTERNAL_SERVICE_TOKEN: "replace-with-a-long-random-token"
  SPRING_MAIL_HOST: "smtp.example.com"
  SPRING_MAIL_PORT: "587"
  SPRING_MAIL_USERNAME: "smtp-user"
  SPRING_MAIL_PASSWORD: "smtp-password"
  TWILIO_ACCOUNT_SID: "replace-me"
  TWILIO_AUTH_TOKEN: "replace-me"
  TWILIO_FROM_NUMBER: "+15555550100"

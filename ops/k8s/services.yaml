apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: eventcart
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/your-org/eventcart/api-gateway:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: eventcart-config
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: eventcart
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: eventcart
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: ghcr.io/your-org/eventcart/notification-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8086
          envFrom:
            - configMapRef:
                name: eventcart-config
          env:
            - name: SPRING_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: eventcart-secrets
                  key: NOTIFICATION_MONGODB_URI
            - name: SPRING_MAIL_HOST
              valueFrom:
                secretKeyRef:
                  name: eventcart-secrets
                  key: SPRING_MAIL_HOST
            - name: SPRING_MAIL_PORT
              valueFrom:
                secretKeyRef:
                  name: eventcart-secrets
                  key: SPRING_MAIL_PORT
            - name: SPRING_MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: eventcart-secrets
                  key: SPRING_MAIL_USERNAME
            - name: SPRING_MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eventcart-secrets
                  key: SPRING_MAIL_PASSWORD
            - name: TWILIO_ACCOUNT_SID
              valueFrom:
                secretKeyRef:
                  name: eventcart-secrets
                  key: TWILIO_ACCOUNT_SID
            - name: TWILIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: eventcart-secrets
                  key: TWILIO_AUTH_TOKEN
            - name: TWILIO_FROM_NUMBER
              valueFrom:
                secretKeyRef:
                  name: eventcart-secrets
                  key: TWILIO_FROM_NUMBER
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8086
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8086
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: eventcart
spec:
  selector:
    app: notification-service
  ports:
    - port: 8086
      targetPort: 8086

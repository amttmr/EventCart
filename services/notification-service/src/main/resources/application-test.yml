spring:
  mongodb:
    uri: mongodb://localhost:27017/eventcart_notification_test
  data:
    mongodb:
      auto-index-creation: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service-test

eventcart:
  security:
    enabled: false
  notifications:
    email:
      enabled: false
      from: noreply@eventcart.local
    sms:
      enabled: false
      account-sid: ""
      auth-token: ""
      from-number: ""
      base-url: https://api.twilio.com
    contacts: {}
  kafka:
    retry:
      interval-ms: 10
      max-attempts: 1
    topics:
      order-created: eventcart.orders.created
      inventory-failed: eventcart.inventory.failed
      payment-completed: eventcart.payments.completed
      payment-failed: eventcart.payments.failed

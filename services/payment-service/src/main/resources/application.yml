server:
  port: 8085

spring:
  application:
    name: payment-service
  mongodb:
    uri: mongodb://eventcart:eventcart@localhost:27017/eventcart_payment?authSource=admin
  data:
    mongodb:
      auto-index-creation: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8088/realms/eventcart
          jwk-set-uri: http://localhost:8088/realms/eventcart/protocol/openid-connect/certs
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  info:
    env:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

info:
  app:
    name: payment-service
    description: Payment simulation service for EventCart

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
  level:
    com.eventcart: INFO

eventcart:
  security:
    enabled: true
  outbox:
    initial-delay: 5s
    poll-delay: 5s
  payment:
    simulation:
      provider-name: MockPay
      failure-amount-threshold: 50000.00
  kafka:
    retry:
      interval-ms: 1000
      max-attempts: 3
    topics:
      inventory-reserved: eventcart.inventory.reserved
      payment-completed: eventcart.payments.completed
      payment-failed: eventcart.payments.failed

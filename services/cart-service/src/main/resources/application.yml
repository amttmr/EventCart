server:
  port: 8082

spring:
  application:
    name: cart-service
  mongodb:
    uri: mongodb://eventcart:eventcart@localhost:27017/eventcart_cart?authSource=admin
  data:
    mongodb:
      auto-index-creation: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8088/realms/eventcart
          jwk-set-uri: http://localhost:8088/realms/eventcart/protocol/openid-connect/certs

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  info:
    env:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

info:
  app:
    name: cart-service
    description: Shopping cart service for EventCart

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
  level:
    com.eventcart: INFO

eventcart:
  security:
    enabled: true
  internal-service:
    header-name: X-EventCart-Internal-Token
    token: ${EVENTCART_INTERNAL_SERVICE_TOKEN:eventcart-local-internal-token}
  clients:
    catalog:
      base-url: http://localhost:8081
      connect-timeout: 2s
      read-timeout: 3s

spring:
  mongodb:
    uri: mongodb://localhost:27017/eventcart_order_test
  data:
    mongodb:
      auto-index-creation: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: order-service-test

eventcart:
  redis:
    host: localhost
    port: 6379
    order-idempotency-ttl: 30m
  clients:
    cart:
      base-url: http://localhost:8082
      connect-timeout: 2s
      read-timeout: 3s
  kafka:
    topics:
      order-created: eventcart.orders.created
      inventory-reserved: eventcart.inventory.reserved
      inventory-failed: eventcart.inventory.failed
      payment-completed: eventcart.payments.completed
      payment-failed: eventcart.payments.failed

server:
  port: 8083

spring:
  application:
    name: order-service
  mongodb:
    uri: mongodb://eventcart:eventcart@localhost:27017/eventcart_order?authSource=admin
  data:
    mongodb:
      auto-index-creation: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8088/realms/eventcart
          jwk-set-uri: http://localhost:8088/realms/eventcart/protocol/openid-connect/certs
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  info:
    env:
      enabled: true
  tracing:
    sampling:
      probability: 1.0

info:
  app:
    name: order-service
    description: Order lifecycle service for EventCart

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
  level:
    com.eventcart: INFO

eventcart:
  security:
    enabled: true
  redis:
    host: localhost
    port: 6379
    order-idempotency-ttl: 30m
  clients:
    cart:
      base-url: http://localhost:8082
      connect-timeout: 2s
      read-timeout: 3s
  kafka:
    retry:
      interval-ms: 1000
      max-attempts: 3
    topics:
      order-created: eventcart.orders.created
      inventory-reserved: eventcart.inventory.reserved
      inventory-failed: eventcart.inventory.failed
      payment-completed: eventcart.payments.completed
      payment-failed: eventcart.payments.failed
